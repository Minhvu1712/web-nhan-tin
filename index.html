<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chia Sẻ Thông Tin & Nhắn Tin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-200">

    <!-- App Container -->
    <div id="app" class="h-full flex flex-col">

        <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
            <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-100 dark:border-slate-700">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-500 text-white text-2xl font-bold mb-4 shadow-lg shadow-primary-500/30">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <h1 id="auth-title" class="text-2xl font-bold tracking-tight">Đăng nhập vào Hệ thống</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Chia sẻ thông tin và tin nhắn trực tuyến thời gian thực</p>
                </div>

                <form id="auth-form" class="space-y-4">
                    <div id="name-group" class="hidden">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tên hiển thị</label>
                        <input type="text" id="auth-name" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email</label>
                        <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Mật khẩu</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full py-3 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl shadow-lg shadow-primary-600/30 transition duration-200">
                        Đăng Nhập
                    </button>
                </form>

                <div class="mt-6 text-center text-sm">
                    <span id="auth-switch-text" class="text-slate-500 dark:text-slate-400">Chưa có tài khoản?</span>
                    <button type="button" id="auth-switch-btn" class="font-semibold text-primary-600 dark:text-primary-400 hover:underline ml-1">Đăng ký ngay</button>
                </div>
            </div>
        </div>

        <!-- 2. GIAO DIỆN CHÍNH (SAU KHI ĐĂNG NHẬP) -->
        <div id="main-app" class="h-full flex overflow-hidden hidden">
            
            <!-- Sidebar -->
            <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between shrink-0">
                <div>
                    <!-- Logo / Brand -->
                    <div class="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-700/50">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-primary-500 text-white flex items-center justify-center font-bold shadow-md shadow-primary-500/20">
                                <i class="fa-solid fa-cube text-sm"></i>
                            </div>
                            <span class="font-bold text-lg tracking-tight">CloudShare</span>
                        </div>
                        <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition">
                            <i class="fa-solid fa-moon dark:hidden"></i>
                            <i class="fa-solid fa-sun hidden dark:block"></i>
                        </button>
                    </div>

                    <!-- Nút Soạn Thư -->
                    <div class="p-4">
                        <button onclick="openComposeModal()" class="w-full py-3 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl shadow-md shadow-primary-600/20 flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-pen-to-square"></i> Soạn Tin / Thư
                        </button>
                    </div>

                    <!-- Thư mục điều hướng -->
                    <nav class="px-3 space-y-1">
                        <button onclick="switchFolder('inbox')" id="nav-inbox" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 transition">
                            <span class="flex items-center gap-3"><i class="fa-solid fa-inbox w-5"></i> Hộp thư đến</span>
                            <span id="badge-inbox" class="px-2 py-0.5 text-xs rounded-full bg-primary-500 text-white font-semibold">0</span>
                        </button>
                        <button onclick="switchFolder('public')" id="nav-public" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
                            <span class="flex items-center gap-3"><i class="fa-solid fa-globe w-5"></i> Bảng tin chung</span>
                            <span id="badge-public" class="px-2 py-0.5 text-xs rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">0</span>
                        </button>
                        <button onclick="switchFolder('sent')" id="nav-sent" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
                            <span class="flex items-center gap-3"><i class="fa-solid fa-paper-plane w-5"></i> Đã gửi</span>
                        </button>
                        <button onclick="switchFolder('drafts')" id="nav-drafts" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
                            <span class="flex items-center gap-3"><i class="fa-solid fa-file-pen w-5"></i> Thư nháp</span>
                            <span id="badge-drafts" class="px-2 py-0.5 text-xs rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">0</span>
                        </button>
                        <button onclick="switchFolder('trash')" id="nav-trash" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
                            <span class="flex items-center gap-3"><i class="fa-solid fa-trash w-5"></i> Thùng rác</span>
                        </button>
                    </nav>
                </div>

                <!-- Thông tin tài khoản & Nút Đăng xuất -->
                <div class="p-4 border-t border-slate-200 dark:border-slate-700 space-y-3">
                    <div class="flex items-center gap-3 px-2">
                        <div id="user-avatar" class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow">U</div>
                        <div class="overflow-hidden">
                            <p id="user-display-name" class="font-semibold text-sm truncate">Tên người dùng</p>
                            <p id="user-display-email" class="text-xs text-slate-500 dark:text-slate-400 truncate">email@example.com</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2.5 px-4 bg-red-50 hover:bg-red-100 dark:bg-red-950/40 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 transition border border-red-200 dark:border-red-900/50 shadow-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất Hệ Thống
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-900">
                <!-- Top Header -->
                <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-4 w-96">
                        <div class="relative w-full">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Tìm kiếm tin nhắn, nội dung, người gửi..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="current-folder-title" class="font-bold text-base text-slate-700 dark:text-slate-200">Hộp thư đến</span>
                    </div>
                </header>

                <!-- Split View: Message List & Message Detail -->
                <div class="flex-1 flex overflow-hidden">
                    <!-- Message List Column -->
                    <div class="w-96 border-r border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col shrink-0">
                        <div id="message-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
                            <!-- Items populated by JS -->
                        </div>
                    </div>

                    <!-- Message Detail View -->
                    <div id="message-detail" class="flex-1 bg-slate-50 dark:bg-slate-900 flex flex-col overflow-y-auto p-8">
                        <div class="m-auto text-center text-slate-400">
                            <i class="fa-regular fa-envelope-open text-5xl mb-3"></i>
                            <p class="text-sm font-medium">Chọn một tin nhắn để xem nội dung chi tiết</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 3. MODAL SOẠN THƯ -->
        <div id="compose-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4">
            <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col">
                <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                    <h3 class="font-bold text-lg">Soạn tin nhắn mới</h3>
                    <button onclick="closeComposeModal()" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form id="compose-form" onsubmit="sendEmail(event)" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Gửi tới</label>
                        <select id="compose-recipient" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                            <option value="public">🌐 Bảng tin chung (Tất cả mọi người đều thấy)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tiêu đề</label>
                        <input type="text" id="compose-subject" required placeholder="Nhập tiêu đề thư..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nội dung</label>
                        <textarea id="compose-body" rows="6" required placeholder="Nhập nội dung chia sẻ..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none transition"></textarea>
                    </div>
                    <div class="flex items-center justify-end gap-3 pt-2">
                        <button type="button" onclick="saveDraft()" class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-semibold transition">
                            Lưu Nháp
                        </button>
                        <button type="submit" class="px-6 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-primary-600/30 transition">
                            Gửi Ngay
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        // State Management
        let currentUser = JSON.parse(localStorage.getItem('cloudshare_user')) || null;
        let currentFolder = 'inbox';
        let currentSelectedMsgId = null;
        let searchQuery = '';

        // Initial Mock Database
        if (!localStorage.getItem('cloudshare_users')) {
            localStorage.setItem('cloudshare_users', JSON.stringify([
                { id: 'u1', name: 'Nguyễn Văn An', email: 'an@example.com', password: '123' },
                { id: 'u2', name: 'Trần Thị Bình', email: 'binh@example.com', password: '123' }
            ]));
        }

        if (!localStorage.getItem('cloudshare_messages')) {
            localStorage.setItem('cloudshare_messages', JSON.stringify([
                {
                    id: 'm1',
                    senderId: 'u1',
                    senderName: 'Nguyễn Văn An',
                    senderEmail: 'an@example.com',
                    recipientId: 'u2',
                    recipientName: 'Trần Thị Bình',
                    subject: 'Chào mừng bạn đến với hệ thống chia sẻ thông tin',
                    body: 'Xin chào Bình,\n\nHệ thống này cho phép chúng ta gửi tin nhắn trực tiếp hoặc đăng thông tin lên bảng tin chung giống như email hoặc outlook.\n\nHãy thử gửi phản hồi lại cho mình nhé!',
                    timestamp: new Date(Date.now() - 3600000).toISOString(),
                    read: false,
                    folder: 'inbox'
                },
                {
                    id: 'm2',
                    senderId: 'u1',
                    senderName: 'Nguyễn Văn An',
                    senderEmail: 'an@example.com',
                    recipientId: 'public',
                    recipientName: 'Bảng tin chung',
                    subject: 'Thông báo họp nhóm tuần này',
                    body: 'Chào mọi người, tuần này chúng ta sẽ họp vào lúc 9h sáng thứ Hai tại phòng họp chung để tổng kết tiến độ công việc.',
                    timestamp: new Date(Date.now() - 7200000).toISOString(),
                    read: true,
                    folder: 'public'
                }
            ]));
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                showMainApp();
            } else {
                showAuthScreen('login');
            }
        });

        // Auth Switcher
        let isRegisterMode = false;
        const authSwitchBtn = document.getElementById('auth-switch-btn');
        authSwitchBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('auth-title');
            const subBtn = document.getElementById('auth-submit-btn');
            const nameGroup = document.getElementById('name-group');
            const switchText = document.getElementById('auth-switch-text');

            if (isRegisterMode) {
                title.textContent = "Tạo tài khoản mới";
                subBtn.textContent = "Đăng Ký";
                nameGroup.classList.remove('hidden');
                switchText.textContent = "Đã có tài khoản?";
                authSwitchBtn.textContent = "Đăng nhập";
            } else {
                title.textContent = "Đăng nhập vào Hệ thống";
                subBtn.textContent = "Đăng Nhập";
                nameGroup.classList.add('hidden');
                switchText.textContent = "Chưa có tài khoản?";
                authSwitchBtn.textContent = "Đăng ký ngay";
            }
        });

        // Auth Form Handler
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            let users = JSON.parse(localStorage.getItem('cloudshare_users'));

            if (isRegisterMode) {
                const name = document.getElementById('auth-name').value.trim();
                if (!name) return alert('Vui lòng nhập tên hiển thị!');
                if (users.some(u => u.email === email)) {
                    return alert('Email này đã được đăng ký!');
                }
                const newUser = { id: 'u_' + Date.now(), name, email, password };
                users.push(newUser);
                localStorage.setItem('cloudshare_users', JSON.stringify(users));
                currentUser = newUser;
                alert('Đăng ký thành công!');
            } else {
                const user = users.find(u => u.email === email && u.password === password);
                if (!user) {
                    return alert('Email hoặc mật khẩu không chính xác!');
                }
                currentUser = user;
            }

            localStorage.setItem('cloudshare_user', JSON.stringify(currentUser));
            showMainApp();
        });

        // Logout
        function handleLogout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?')) {
                localStorage.removeItem('cloudshare_user');
                sessionStorage.clear();
                currentUser = null;
                window.location.reload();
            }
        }

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }

        function showMainApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display-name').textContent = currentUser.name;
            document.getElementById('user-display-email').textContent = currentUser.email;
            document.getElementById('user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();

            loadRecipientDropdown();
            renderApp();
        }

        function loadRecipientDropdown() {
            const select = document.getElementById('compose-recipient');
            let users = JSON.parse(localStorage.getItem('cloudshare_users'));
            let html = `<option value="public">🌐 Bảng tin chung (Tất cả mọi người đều thấy)</option>`;
            users.forEach(u => {
                if (u.email !== currentUser.email) {
                    html += `<option value="${u.id}">${u.name} (${u.email})</option>`;
                }
            });
            select.innerHTML = html;
        }

        function switchFolder(folder) {
            currentFolder = folder;
            currentSelectedMsgId = null;
            
            ['inbox', 'public', 'sent', 'drafts', 'trash'].forEach(f => {
                const btn = document.getElementById(`nav-${f}`);
                if (f === folder) {
                    btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 transition";
                } else {
                    btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition";
                }
            });

            const titles = { inbox: 'Hộp thư đến', public: 'Bảng tin chung', sent: 'Thư đã gửi', drafts: 'Thư nháp', trash: 'Thùng rác' };
            document.getElementById('current-folder-title').textContent = titles[folder];

            renderApp();
        }

        function renderApp() {
            let messages = JSON.parse(localStorage.getItem('cloudshare_messages')) || [];

            let inboxCount = messages.filter(m => m.recipientId === currentUser.id && m.folder === 'inbox' && !m.read).length;
            let publicCount = messages.filter(m => m.folder === 'public' && !m.read).length;
            let draftsCount = messages.filter(m => m.senderId === currentUser.id && m.folder === 'drafts').length;

            document.getElementById('badge-inbox').textContent = inboxCount;
            document.getElementById('badge-public').textContent = publicCount;
            document.getElementById('badge-drafts').textContent = draftsCount;

            let filtered = messages.filter(m => {
                if (currentFolder === 'inbox') return m.recipientId === currentUser.id && m.folder === 'inbox';
                if (currentFolder === 'public') return m.folder === 'public';
                if (currentFolder === 'sent') return m.senderId === currentUser.id && m.folder === 'sent';
                if (currentFolder === 'drafts') return m.senderId === currentUser.id && m.folder === 'drafts';
                if (currentFolder === 'trash') return m.folder === 'trash' && (m.senderId === currentUser.id || m.recipientId === currentUser.id);
                return false;
            });

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(m => m.subject.toLowerCase().includes(q) || m.body.toLowerCase().includes(q) || m.senderName.toLowerCase().includes(q));
            }

            const listEl = document.getElementById('message-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Không có tin nhắn nào trong thư mục này</div>`;
                document.getElementById('message-detail').innerHTML = `
                    <div class="m-auto text-center text-slate-400">
                        <i class="fa-regular fa-envelope-open text-5xl mb-3"></i>
                        <p class="text-sm font-medium">Không có tin nhắn hiển thị</p>
                    </div>`;
                return;
            }

            let html = '';
            filtered.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(m => {
                const isUnread = !m.read && m.recipientId === currentUser.id;
                const activeClass = currentSelectedMsgId === m.id ? 'bg-primary-50/60 dark:bg-primary-900/20' : 'hover:bg-slate-50 dark:hover:bg-slate-700/30';
                
                html += `
                    <div onclick="selectMessage('${m.id}')" class="p-4 cursor-pointer transition ${activeClass}">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-semibold text-sm truncate ${isUnread ? 'text-primary-600 dark:text-primary-400 font-bold' : ''}">
                                ${currentFolder === 'sent' ? 'Đến: ' + m.recipientName : m.senderName}
                            </span>
                            <span class="text-xs text-slate-400">${new Date(m.timestamp).toLocaleDateString()}</span>
                        </div>
                        <h4 class="text-sm font-medium truncate ${isUnread ? 'font-bold' : ''}">${m.subject}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-1">${m.body}</p>
                    </div>
                `;
            });
            listEl.innerHTML = html;

            if (!currentSelectedMsgId && filtered.length > 0) {
                selectMessage(filtered[0].id);
            }
        }

        function selectMessage(id) {
            currentSelectedMsgId = id;
            let messages = JSON.parse(localStorage.getItem('cloudshare_messages'));
            const msg = messages.find(m => m.id === id);

            if (!msg) return;

            if (!msg.read && msg.recipientId === currentUser.id) {
                msg.read = true;
                localStorage.setItem('cloudshare_messages', JSON.stringify(messages));
            }

            renderApp();

            const detailEl = document.getElementById('message-detail');
            detailEl.innerHTML = `
                <div class="p-8 max-w-3xl w-full mx-auto">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
                        <div class="flex items-start justify-between border-b border-slate-100 dark:border-slate-700 pb-4 mb-6">
                            <div>
                                <h2 class="text-xl font-bold mb-2">${msg.subject}</h2>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Từ: <span class="font-semibold text-slate-700 dark:text-slate-200">${msg.senderName}</span> (${msg.senderEmail})</p>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Đến: <span class="font-semibold text-slate-700 dark:text-slate-200">${msg.recipientName}</span></p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400">${new Date(msg.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="prose dark:prose-invert max-w-none text-sm leading-relaxed whitespace-pre-wrap text-slate-700 dark:text-slate-300 mb-8">
                            ${msg.body}
                        </div>
                        <div class="flex items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                            ${currentFolder !== 'trash' ? `
                                <button onclick="moveToTrash('${msg.id}')" class="px-4 py-2 bg-red-50 hover:bg-red-100 dark:bg-red-950/40 text-red-600 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                                    <i class="fa-solid fa-trash"></i> Xóa
                                </button>
                            ` : `
                                <button onclick="deleteForever('${msg.id}')" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2">
                                    <i class="fa-solid fa-xmark"></i> Xóa vĩnh viễn
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function openComposeModal() {
            document.getElementById('compose-modal').classList.remove('hidden');
        }
        function closeComposeModal() {
            document.getElementById('compose-modal').classList.add('hidden');
        }

        function sendEmail(e) {
            e.preventDefault();
            const recipientId = document.getElementById('compose-recipient').value;
            const subject = document.getElementById('compose-subject').value;
            const body = document.getElementById('compose-body').value;

            let users = JSON.parse(localStorage.getItem('cloudshare_users'));
            let recipientName = 'Bảng tin chung';
            let folder = 'inbox';

            if (recipientId !== 'public') {
                const recUser = users.find(u => u.id === recipientId);
                recipientName = recUser ? recUser.name : 'Người dùng';
            } else {
                folder = 'public';
            }

            const newMsg = {
                id: 'm_' + Date.now(),
                senderId: currentUser.id,
                senderName: currentUser.name,
                senderEmail: currentUser.email,
                recipientId: recipientId,
                recipientName: recipientName,
                subject,
                body,
                timestamp: new Date().toISOString(),
                read: false,
                folder: folder
            };

            let messages = JSON.parse(localStorage.getItem('cloudshare_messages'));
            messages.push(newMsg);
            localStorage.setItem('cloudshare_messages', JSON.stringify(messages));

            closeComposeModal();
            document.getElementById('compose-form').reset();
            alert('Gửi tin nhắn thành công!');
            renderApp();
        }

        function saveDraft() {
            const recipientId = document.getElementById('compose-recipient').value;
            const subject = document.getElementById('compose-subject').value;
            const body = document.getElementById('compose-body').value;

            let users = JSON.parse(localStorage.getItem('cloudshare_users'));
            let recipientName = recipientId === 'public' ? 'Bảng tin chung' : (users.find(u => u.id === recipientId)?.name || 'Nháp');

            const newMsg = {
                id: 'm_' + Date.now(),
                senderId: currentUser.id,
                senderName: currentUser.name,
                senderEmail: currentUser.email,
                recipientId: recipientId,
                recipientName: recipientName,
                subject: subject || '(Không có tiêu đề)',
                body,
                timestamp: new Date().toISOString(),
                read: true,
                folder: 'drafts'
            };

            let messages = JSON.parse(localStorage.getItem('cloudshare_messages'));
            messages.push(newMsg);
            localStorage.setItem('cloudshare_messages', JSON.stringify(messages));

            closeComposeModal();
            document.getElementById('compose-form').reset();
            alert('Đã lưu vào Thư nháp!');
            renderApp();
        }

        function moveToTrash(id) {
            let messages = JSON.parse(localStorage.getItem('cloudshare_messages'));
            const msg = messages.find(m => m.id === id);
            if (msg) {
                msg.folder = 'trash';
                localStorage.setItem('cloudshare_messages', JSON.stringify(messages));
                currentSelectedMsgId = null;
                renderApp();
            }
        }

        function deleteForever(id) {
            let messages = JSON.parse(localStorage.getItem('cloudshare_messages'));
            messages = messages.filter(m => m.id !== id);
            localStorage.setItem('cloudshare_messages', JSON.stringify(messages));
            currentSelectedMsgId = null;
            renderApp();
        }

        function handleSearch(val) {
            searchQuery = val;
            renderApp();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
